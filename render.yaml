# FinFluent en Render: UN solo servicio web (Flask sirve la API y el front compilado).
# La base de datos vive en Supabase: DATABASE_URL se pega a mano en el panel de Render.
services:
    - type: web
      region: ohio
      name: finfluent
      env: python
      buildCommand: "./render_build.sh"
      startCommand: "gunicorn wsgi --chdir ./src/ --workers 2 --threads 4 --timeout 60"
      plan: free
      numInstances: 1
      envVars:
          - key: VITE_BASENAME
            value: /
          - key: FLASK_APP
            value: src/app.py
          - key: FLASK_DEBUG
            value: 0
          - key: PYTHON_VERSION
            value: 3.13.1
          - key: NODE_VERSION
            value: 20.18.0
          - key: FLASK_APP_KEY
            generateValue: true
          - key: JWT_SECRET_KEY
            generateValue: true
          - key: DATABASE_URL        # cadena de conexión de Supabase (pooler)
            sync: false
          - key: SUPERADMIN_USER
            sync: false
          - key: SUPERADMIN_PASSWORD
            sync: false
          - key: SUPERADMIN_NAME
            sync: false
